name: Build Extension

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating GitHub releases on tags; read-only otherwise

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: native-host/package-lock.json

      - name: Install native-host dependencies (production only)
        working-directory: native-host
        run: npm ci --omit=dev

      # -----------------------------------------------------------------------
      # Bundle the extension zip
      # The zip contains:
      #   extension/  – the Firefox WebExtension (manifest + scripts + icons)
      #   native-host/ – the Node.js MCP server (with node_modules)
      #   scripts/    – install-host.sh / install-host.ps1
      #   README.md
      # -----------------------------------------------------------------------
      - name: Create extension zip
        run: |
          mkdir -p dist
          zip -r dist/tab-mcp.zip \
            extension/ \
            native-host/ \
            scripts/ \
            README.md \
            --exclude "*.git*"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: tab-mcp
          path: dist/tab-mcp.zip
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # On version tags: create a GitHub release and attach the zip
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tab-mcp.zip
          generate_release_notes: true
